[project]
name = "data_workspace_local"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.15",
    "dagster-dbt==0.29.15",
    "dbt-core==1.11.12",
    "dbt-postgres==1.11.0",
    "dagster-dg-cli==1.13.15",
    "dagster-webserver==1.13.15",
    "psycopg[binary]",
    "requests",
    "dagster-postgres>=0.29.15",
]

[tool.dg]
directory_type = "deployment"

[tool.uv.workspace]
members = ["projects/*", "utils"]

[tool.uv.sources]
data-workspace-local = { workspace = true }

[dependency-groups]
dev = [
    "data-workspace-local",
]
